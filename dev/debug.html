<!doctype html><meta charset="utf-8"><title>dbg</title>
<body style="background:#222;color:#ddd;font:12px monospace"><pre id="o"></pre>
<script type="module">
import { loadAssets, preloadSprites, assets, debugLayout } from '../src/assets/index.ts';
const o=document.getElementById('o');
await loadAssets(); const m=assets(); await preloadSprites();
const look={skin:'0',face:m.pool.face[0],hair:m.pool.hair[0],cap:m.pool.cap[0],coat:m.pool.coat[0],pants:m.pool.pants[0],shoes:m.pool.shoes[0],glove:m.pool.glove[0],cape:m.pool.cape[0],weapon:m.pool.weapon[0]};
o.textContent = JSON.stringify(look)+'\n\n'+debugLayout(look).map(p=>JSON.stringify(p)).join('\n');
document.title='ready';
</script>
