<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- artifact:start -->
<title>Home Turf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
  :root {
    --paper: #e6e9e3;
    --panel: #f3f4f0;
    --ink: #16191d;
    --ink-2: #57606a;
    --line: #c5cbc3;
    --stage: #c1c7bf;
    --blue: #2358d6;
    --red: #d63f2b;
    --on-ink: #ffffff;
    --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --ui: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 500 15px/1.35 var(--ui);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  #app {
    height: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding-inline: 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-block: 10px 8px;
  }
  .mark { font: 900 27px/1 var(--display); letter-spacing: 0.03em; }
  .mark .h { color: var(--blue); }
  .mark .t { color: var(--red); }
  .phase {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-2);
    text-align: right;
  }
  #stage {
    position: relative;
    flex: 0 1 auto;
    height: min(100%, calc((min(100vw, 560px) - 32px) * 1.08));
    min-height: 180px;
    border-radius: 6px;
    overflow: hidden;
    background: var(--stage);
  }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud {
    position: absolute;
    inset: 0 0 auto 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    padding: 9px 10px 0;
    align-items: start;
    pointer-events: none;
  }
  .hp .who {
    display: flex;
    gap: 6px;
    align-items: baseline;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .hp .who b { font: 900 17px/1 var(--display); letter-spacing: 0.04em; color: var(--blue); }
  .hp.r .who { justify-content: flex-end; }
  .hp.r .who b { color: var(--red); }
  .bar { position: relative; height: 8px; margin-top: 4px; background: rgba(22, 25, 29, 0.16); border-radius: 2px; overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; }
  .hp.r .bar i { left: auto; right: 0; }
  .bar .chip { background: rgba(255, 255, 255, 0.85); }
  .hp .fill { background: var(--blue); }
  .hp.r .fill { background: var(--red); }
  #clock { font: 900 22px/1 var(--display); font-variant-numeric: tabular-nums; padding-top: 1px; min-width: 44px; text-align: center; }
  #clock.sq { color: var(--red); }
  #toast {
    position: absolute;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100% - 24px);
    box-sizing: border-box;
    background: var(--ink);
    color: var(--on-ink);
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    pointer-events: none;
  }
  #result {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 12px;
    background: rgba(243, 244, 240, 0.95);
    border: 2px solid var(--ink);
    border-radius: 6px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .res-k { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
  .res-t { font: 900 40px/0.95 var(--display); letter-spacing: 0.02em; text-wrap: balance; }
  .res-t.b { color: var(--blue); }
  .res-t.r { color: var(--red); }
  #resStats { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 4px 0 0; font-size: 14px; }
  #resStats dt { color: var(--ink-2); }
  #resStats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .panel { flex: 1 0 auto; display: flex; flex-direction: column; gap: 10px; padding-block: 12px 14px; }
  .panel .actions { margin-top: auto; }
  .row-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .lbl { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
  .budget { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .budget.full { color: var(--red); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .chips, .tools { display: grid; gap: 8px; }
  .chips { grid-template-columns: repeat(3, 1fr); }
  .tools { grid-template-columns: repeat(4, 1fr); }
  .opt {
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 7px 9px;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .opt b { font: 900 19px/1 var(--display); letter-spacing: 0.03em; }
  .opt small { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  .opt[aria-pressed="true"] small { color: #c3c9cf; }
  .tool { gap: 3px; padding: 7px 8px; }
  .tool .ic { display: flex; align-items: center; justify-content: space-between; }
  .tool svg { width: 20px; height: 20px; }
  .tool b { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint { margin: 0; font-size: 13px; color: var(--ink-2); max-width: 62ch; }
  .actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
  .actions.four { grid-template-columns: 1fr 1fr; }
  .go {
    background: var(--ink);
    color: var(--on-ink);
    border: 0;
    border-radius: 6px;
    padding: 11px 12px;
    font: 900 22px/1 var(--display);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .ghost {
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #ticker { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; min-height: 64px; font-size: 14px; }
  #ticker li { display: flex; gap: 8px; align-items: baseline; }
  #ticker time { font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 30px; }
  #ticker .sw { flex: none; width: 8px; height: 8px; border-radius: 1px; background: var(--ink-2); transform: translateY(-1px); }
  #ticker .s0 .sw { background: var(--blue); }
  #ticker .s1 .sw { background: var(--red); }
  #ticker .empty { color: var(--ink-2); }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="mark"><span class="h">HOME</span> <span class="t">TURF</span></div>
    <div class="phase" id="phase">Build your half</div>
  </header>

  <div id="stage">
    <canvas id="cv" aria-label="Arena"></canvas>
    <div id="hud" hidden>
      <div class="hp" id="hpB">
        <div class="who"><b>You</b><span id="wB">Sword</span></div>
        <div class="bar"><i class="chip"></i><i class="fill"></i></div>
      </div>
      <div id="clock">0:00</div>
      <div class="hp r" id="hpR">
        <div class="who"><span id="wR">Bow</span><b>Rival</b></div>
        <div class="bar"><i class="chip"></i><i class="fill"></i></div>
      </div>
    </div>
    <div id="toast" hidden></div>
    <div id="result" hidden>
      <div class="res-k" id="resKicker">KO · 0:24</div>
      <div class="res-t" id="resTitle">You win</div>
      <dl id="resStats"></dl>
    </div>
  </div>

  <section class="panel" id="buildPanel">
    <div class="row-h"><span class="lbl">Weapon</span></div>
    <div class="chips" id="weapons">
      <button class="opt" data-w="sword" aria-pressed="true"><b>Sword</b><small>7f · combo</small></button>
      <button class="opt" data-w="hammer" aria-pressed="false"><b>Hammer</b><small>17f · armor</small></button>
      <button class="opt" data-w="bow" aria-pressed="false"><b>Bow</b><small>20f · range</small></button>
    </div>
    <div class="row-h"><span class="lbl">Your half · tap to build</span><span class="budget" id="budget">9 / 10 pts</span></div>
    <div class="tools" id="tools">
      <button class="opt tool" data-t="block" aria-pressed="true">
        <span class="ic"><svg viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="2" width="18" height="18" fill="#3b4a68"/><rect x="2" y="2" width="18" height="3" fill="#2358d6"/></svg><small>1 pt</small></span>
        <b>Block</b>
      </button>
      <button class="opt tool" data-t="spikes" aria-pressed="false">
        <span class="ic"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M2 20 L5.5 9 L9 20 Z M8 20 L11.5 9 L15 20 Z M14 20 L17.5 9 L21 20 Z" fill="#16191d"/><path d="M4.4 12.5 L5.5 9 L6.6 12.5 Z M10.4 12.5 L11.5 9 L12.6 12.5 Z M16.4 12.5 L17.5 9 L18.6 12.5 Z" fill="#2358d6"/></svg><small>2 pts</small></span>
        <b>Spikes</b>
      </button>
      <button class="opt tool" data-t="pad" aria-pressed="false">
        <span class="ic"><svg viewBox="0 0 22 22" aria-hidden="true"><rect x="3" y="18" width="16" height="3" fill="#16191d"/><path d="M6 18 L16 15.5 L6 13 L16 10.5" stroke="#16191d" stroke-width="1.6" fill="none"/><rect x="2" y="7.5" width="18" height="3" fill="#2358d6"/><path d="M7 5 L11 2 L15 5" stroke="#2358d6" stroke-width="1.6" fill="none"/></svg><small>2 pts</small></span>
        <b>Pad</b>
      </button>
      <button class="opt tool" data-t="erase" aria-pressed="false">
        <span class="ic"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M5 5 L17 17 M17 5 L5 17" stroke="#16191d" stroke-width="2.6" stroke-linecap="round"/></svg><small></small></span>
        <b>Erase</b>
      </button>
    </div>
    <p class="hint">Your fighter knows where your spikes are. The rival finds them by stepping on them. Pads launch only the fighter who built them.</p>
    <div class="actions">
      <button class="ghost" id="clearBtn">Clear</button>
      <button class="go" id="fightBtn">Fight</button>
    </div>
  </section>

  <section class="panel" id="fightPanel" hidden>
    <div class="row-h"><span class="lbl">What happened</span><span class="lbl" id="seedLbl"></span></div>
    <ol id="ticker"><li class="empty">Nothing yet.</li></ol>
    <div class="actions four" id="liveActions">
      <button class="ghost" id="speedBtn">Speed 1×</button>
      <button class="ghost" id="editBtn">Edit build</button>
    </div>
    <div class="actions four" id="endActions" hidden>
      <button class="ghost" id="replayBtn">Replay</button>
      <button class="ghost" id="rematchBtn">Rematch</button>
      <button class="ghost" id="edit2Btn">Edit build</button>
      <button class="go" id="nextBtn">Next rival</button>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';

// ---------------------------------------------------------------- constants
const COLS = 20, ROWS = 12, DT = 1 / 60;
const W = 0.56, H = 1.46;                       // fighter body box, in tiles
const P = { accG: 80, accA: 46, fric: 64, g: 58, jumpV: 19.6, cut: 0.45, maxFall: 25, padV: 27.5 };
const ARROW_V = 23, ARROW_G = 12;
const BUDGET = 10, COST = { block: 1, spikes: 2, pad: 2 };
const SPAWN_C = 2, SPAWN_R = 10, BMIN = 1, BMAX = 8;   // local build columns; 9 and 10 are no-man's-land
const SQ_START = 20, SQ_SPEED = 0.42, SQ_MAX = 7.5, TIME_CAP = 75;
const EV_LAND = 1, EV_WALL = 2, EV_PAD = 8, EV_JUMP = 16;
const WEAP = {
  sword: { name: 'Sword', speed: 7.2 },
  hammer: { name: 'Hammer', speed: 5.7 },
  bow: { name: 'Bow', speed: 6.7 },
};
const MIN_SPEED = 5.7;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const PAL = {
  out: '#c1c7bf', bg: '#d7dbd5', tile: '#3f474e', tileHi: '#5b656d', blockB: '#3b4a68', blockR: '#5e3f3c',
  ink: '#16191d', far: '#4d555c', hatch: 'rgba(22,25,29,0.07)', grid: 'rgba(22,25,29,0.09)',
  blue: '#2358d6', red: '#d63f2b', spark: '#fff3c4', steel: '#f4f6f8', fog: 'rgba(193,199,191,0.93)',
  tintB: 'rgba(35,88,214,0.06)', tintR: 'rgba(214,63,43,0.06)', label: 'rgba(22,25,29,0.32)',
};
const PAL_INV = {
  out: '#16191d', bg: '#16191d', tile: '#eef0ec', tileHi: '#ffffff', blockB: '#eef0ec', blockR: '#eef0ec',
  ink: '#ffffff', far: '#d9ddd6', hatch: 'rgba(0,0,0,0)', grid: 'rgba(0,0,0,0)',
  blue: '#7fa3ff', red: '#ff7c66', spark: '#ffffff', steel: '#16191d', fog: 'rgba(22,25,29,0.9)',
  tintB: 'rgba(0,0,0,0)', tintR: 'rgba(0,0,0,0)', label: 'rgba(0,0,0,0)',
};
const TEAM = ['blue', 'red'];

// ---------------------------------------------------------------- state
let A = null;              // compiled arena
let world = null;          // fight/build clock, rng, effects
let U = [];                // fighters
let arrows = [], parts = [];
let mode = 'build';
let speedMul = 1;
let fightSeed = 1;
const rng = () => world.rng();

function mulberry(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const approach = (v, t, s) => (v < t ? Math.min(t, v + s) : Math.max(t, v - s));
const wrap = (a) => ((((a + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)) - Math.PI;
const clockStr = (f) => { const s = Math.floor(f / 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

// ---------------------------------------------------------------- arena
// A build is stored in the blue player's local coordinates; the rival's is mirrored.
function makeArena(builds) {
  const n = COLS * ROWS;
  const a = {
    solid: new Uint8Array(n), owner: new Int8Array(n).fill(-1),
    spikes: new Int8Array(n).fill(-1), pads: new Int8Array(n).fill(-1), padAnim: new Float32Array(n),
  };
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) a.solid[r * COLS + c] = 1;
  }
  builds.forEach((bd, side) => {
    if (!bd) return;
    for (const p of bd.pieces) {
      const c = side ? COLS - 1 - p.c : p.c, i = p.r * COLS + c;
      if (p.t === 'block') { a.solid[i] = 1; a.owner[i] = side; }
      else if (p.t === 'spikes') a.spikes[i] = side;
      else a.pads[i] = side;
    }
  });
  return a;
}
const solidAt = (c, r) => (c < 0 || c >= COLS || r < 0 || r >= ROWS) ? true : A.solid[r * COLS + c] === 1;
function boxSolid(x0, y0, x1, y1) {
  const c0 = Math.floor(x0), c1 = Math.floor(x1 - 1e-6), r0 = Math.floor(y0), r1 = Math.floor(y1 - 1e-6);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (solidAt(c, r)) return true;
  return false;
}
const standable = (c, r) => c > 0 && c < COLS - 1 && r > 1 && r < ROWS - 1 && !solidAt(c, r) && !solidAt(c, r - 1) && solidAt(c, r + 1);

// ---------------------------------------------------------------- physics
// One controller shared by the real fight and by every planning simulation,
// so a jump the planner found is a jump the fighter can make.
function physStep(b, dir, press, hold, side, ctl, fr) {
  let ev = 0;
  if (b.gr) {
    if (ctl && dir) b.vx = approach(b.vx, dir * b.speed, P.accG * DT);
    else b.vx = approach(b.vx, 0, P.fric * fr * DT);
  } else if (ctl && dir) b.vx = approach(b.vx, dir * b.speed, P.accA * DT);
  if (ctl && press && b.gr) { b.vy = -P.jumpV; b.gr = false; b.jumping = true; ev |= EV_JUMP; }
  if (b.jumping) {
    if (b.vy >= 0) b.jumping = false;
    else if (!hold) { b.vy *= P.cut; b.jumping = false; }
  }
  b.vy = Math.min(b.vy + P.g * DT, P.maxFall);
  const dx = b.vx * DT;
  b.x += dx; b.wallV = 0;
  if (dx !== 0 && boxSolid(b.x - W / 2, b.y - H, b.x + W / 2, b.y)) {
    if (dx > 0) b.x = Math.floor(b.x + W / 2 - 1e-6) - W / 2 - 1e-4;
    else b.x = Math.floor(b.x - W / 2) + 1 + W / 2 + 1e-4;
    b.wallV = b.vx; b.vx = 0; ev |= EV_WALL;
  }
  const dy = b.vy * DT, wasGr = b.gr;
  b.y += dy; b.gr = false;
  if (boxSolid(b.x - W / 2, b.y - H, b.x + W / 2, b.y)) {
    if (dy > 0) { b.y = Math.floor(b.y - 1e-6); b.landV = b.vy; b.vy = 0; b.gr = true; if (!wasGr) ev |= EV_LAND; }
    else { b.y = Math.floor(b.y - H) + 1 + H + 1e-4; b.vy = 0; }
  }
  b.spike = -1;
  const c0 = Math.floor(b.x - W / 2), c1 = Math.floor(b.x + W / 2 - 1e-6), r0 = Math.floor(b.y - H), r1 = Math.floor(b.y - 1e-6);
  for (let r = Math.max(0, r0); r <= Math.min(ROWS - 1, r1); r++) for (let c = Math.max(0, c0); c <= Math.min(COLS - 1, c1); c++) {
    const i = r * COLS + c;
    if (A.spikes[i] >= 0 && b.x + W / 2 > c + 0.12 && b.x - W / 2 < c + 0.88 && b.y > r + 0.58) b.spike = i;
    if (A.pads[i] === side && b.gr && r === r1 && b.x > c + 0.08 && b.x < c + 0.92) {
      b.vy = -P.padV; b.gr = false; b.jumping = false; b.pad = i; ev |= EV_PAD;
    }
  }
  return ev;
}
const stateOf = (b) => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, gr: b.gr, jumping: b.jumping });

// ---------------------------------------------------------------- navigation
// A "macro" is a scripted input: hold a direction (after a delay) and hold jump for n frames.
const MACROS = [];
for (const dir of [-1, 0, 1]) for (const hold of [5, 10, 18]) for (const delay of (dir ? [0, 8] : [0])) MACROS.push({ dir, hold, delay });
MACROS.push({ dir: -1, hold: 0, delay: 0 }, { dir: 1, hold: 0, delay: 0 });
const PADM = [];
for (const dir of [-1, 0, 1]) for (const delay of (dir ? [0, 10, 22] : [0])) PADM.push({ dir, hold: 0, delay });

function simMacro(s, m, side, speed) {
  const b = { x: s.x, y: s.y, vx: s.vx, vy: s.vy, gr: s.gr, jumping: s.jumping, speed };
  let air = !b.gr, land = -1, spikes = null, f = 0;
  for (; f < 170; f++) {
    const dir = land >= 0 ? 0 : (f >= m.delay ? m.dir : 0);
    const ev = physStep(b, dir, f === 0 && m.hold > 0, f < m.hold, side, true, 1);
    if (b.spike >= 0) { if (!spikes) spikes = []; if (!spikes.includes(b.spike)) spikes.push(b.spike); }
    if ((ev & EV_PAD) && (air || f > 0)) {
      const i = b.pad;
      return { c: i % COLS, r: Math.floor(i / COLS), frames: f + 1, spikes, x: b.x };
    }
    if (!b.gr) air = true;
    else if (air && land < 0) land = f;
    if (land >= 0 && (Math.abs(b.vx) < 0.5 || f - land > 16)) break;
    if (!air && f > 40) return null;
  }
  if (land < 0 || !b.gr) return null;
  return { c: Math.floor(b.x), r: Math.floor(b.y - 1e-6), frames: f + 1, spikes, x: b.x };
}

function buildNav(side, speed, cMax = COLS) {
  const idx = new Int16Array(COLS * ROWS).fill(-1), nodes = [];
  for (let r = 1; r < ROWS - 1; r++) for (let c = 1; c < Math.min(cMax, COLS - 1); c++) {
    if (!standable(c, r)) continue;
    const i = r * COLS + c;
    idx[i] = nodes.length;
    nodes.push({ c, r, i, pad: A.pads[i] === side, spike: A.spikes[i], edges: [] });
  }
  nodes.forEach((n, ni) => {
    const best = new Map();
    const add = (res, type, m) => {
      const j = idx[res.r * COLS + res.c];
      if (j < 0 || j === ni) return;

    const mid = 10 * COLS + 9, spawn = SPAWN_R * COLS + SPAWN_C;

    const rOut = reach(out, M);
    if (!rOut[S]) return { ok: false, msg: 'The rival needs a way to reach your spawn.' };
    const back = reach(out, M, true);
    for (let i = 0; i < rOut.length; i++) if (rOut[i] && !back[i]) return { ok: false, msg: 'That makes a pit the rival could never climb out of.' };

  const hx = S.head.x - S.neck.x, hy = S.head.y - S.neck.y, hd = Math.hypot(hx, hy) || 1;
  const px = -hy / hd, py = hx / hd, bx = S.head.x + hx / hd * 0.02, by = S.head.y + hy / hd * 0.02;
  stroke([{ x: bx - px * 0.16, y: by - py * 0.16 }, { x: bx + px * 0.16, y: by + py * 0.16 }], team, 0.075);
  drawWeapon(S, side, pal, ink);
  stroke([S.sh, S.ef, S.hf], ink, lw);
}
function drawWeapon(S, side, pal, ink) {
  const w = S.wp;
  if (S.w === 'sword') {
    stroke([w.pommel, S.hf], ink, 0.07);
    stroke([S.hf, w.tip], ink, 0.1);
    stroke([S.hf, w.tip], pal.steel, 0.045);
    stroke([w.g1, w.g2], ink, 0.075);
  } else if (S.w === 'hammer') {
    stroke([w.end, w.neck], ink, 0.07);
    ctx.fillStyle = ink; ctx.beginPath();
    ctx.moveTo(w.c1.x, w.c1.y); ctx.lineTo(w.c2.x, w.c2.y); ctx.lineTo(w.c3.x, w.c3.y); ctx.lineTo(w.c4.x, w.c4.y); ctx.closePath(); ctx.fill();
    stroke([w.c1, w.c4], pal[TEAM[side]], 0.05);
  } else {
    ctx.strokeStyle = ink; ctx.lineWidth = 0.065; ctx.beginPath();
    ctx.moveTo(w.t1.x, w.t1.y); ctx.quadraticCurveTo(w.ctl.x, w.ctl.y, w.t2.x, w.t2.y); ctx.stroke();
    stroke([w.t1, w.nock, w.t2], pal.far, 0.018);
    if (w.a1) drawArrowShape(w.a1.x, w.a1.y, w.a2.x, w.a2.y, pal, side, ink);
  }
}
function drawArrowShape(x0, y0, x1, y1, pal, side, ink) {
  const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  stroke([{ x: x0, y: y0 }, { x: x1, y: y1 }], ink, 0.035);
  ctx.fillStyle = ink; ctx.beginPath();
  ctx.moveTo(x1 + ux * 0.12, y1 + uy * 0.12); ctx.lineTo(x1 - uy * 0.06, y1 + ux * 0.06); ctx.lineTo(x1 + uy * 0.06, y1 - ux * 0.06); ctx.fill();
  stroke([{ x: x0 + ux * 0.02, y: y0 + uy * 0.02 }, { x: x0 + ux * 0.16, y: y0 + uy * 0.16 }], pal[TEAM[side]], 0.08);
}
function drawTrail(u, pal) {
  const t = u.trail;
  if (t.length < 2) return;
  const c = pal[TEAM[u.side]];
  for (let i = 1; i < t.length; i++) {
    const a = t[i - 1], b = t[i], al = Math.max(0, 1 - b.age / 7) * 0.4;
    ctx.globalAlpha = al; ctx.fillStyle = c; ctx.beginPath();
    ctx.moveTo(a.bx, a.by); ctx.lineTo(a.tx, a.ty); ctx.lineTo(b.tx, b.ty); ctx.lineTo(b.bx, b.by); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = al * 2; stroke([{ x: a.tx, y: a.ty }, { x: b.tx, y: b.ty }], c, 0.05);
  }
  ctx.globalAlpha = 1;
}
function drawParts(pal) {
  for (const p of parts) {
    const k = 1 - p.life / p.max;
    if (p.k === 's') { ctx.lineCap = 'round'; stroke([{ x: p.x, y: p.y }, { x: p.x - p.vx * 0.025, y: p.y - p.vy * 0.025 }], col(pal, p.c), 0.06 * k + 0.01); }
    else if (p.k === 'd') { ctx.globalAlpha = 0.35 * k; ctx.fillStyle = pal.far; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1; }
    else if (p.k === 'r') { ctx.globalAlpha = k; ctx.strokeStyle = col(pal, p.c); ctx.lineWidth = 0.07 * k; ctx.beginPath(); ctx.arc(p.x, p.y, 0.1 + (p.r1 - 0.1) * (1 - k * k), 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1; }
    else if (p.k === 'f') {
      const L = p.len * (0.6 + 0.4 * (1 - k)), cx = Math.cos(p.ang), sy = Math.sin(p.ang);
      ctx.globalAlpha = k; ctx.fillStyle = col(pal, p.c); ctx.beginPath();
      ctx.moveTo(p.x - cx * L, p.y - sy * L); ctx.lineTo(p.x - sy * 0.09 * k, p.y + cx * 0.09 * k);
      ctx.lineTo(p.x + cx * L, p.y + sy * L); ctx.lineTo(p.x + sy * 0.09 * k, p.y - cx * 0.09 * k); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}
function screenText(txt, x, y, size, fill, strokeC, align = 'center', alpha = 1) {
  ctx.globalAlpha = alpha;
  ctx.font = `900 ${size}px ${getComputedStyle(document.documentElement).getPropertyValue('--display')}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (strokeC) { ctx.lineWidth = Math.max(2, size * 0.12); ctx.strokeStyle = strokeC; ctx.lineJoin = 'round'; ctx.strokeText(txt, x, y); }
  ctx.fillStyle = fill; ctx.fillText(txt, x, y);
  ctx.globalAlpha = 1;
}
let flashCell = null;
function render() {
  const pal = world && world.impact > 0 ? PAL_INV : PAL;
  updateCamera();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = pal.out; ctx.fillRect(0, 0, cv.width, cv.height);
  let sx = 0, sy = 0;
  if (world.shake > 0.2) {
    if (!REDUCED) { sx = (Math.random() - 0.5) * 2 * world.shake; sy = (Math.random() - 0.5) * 2 * world.shake; }
    world.shake *= 0.86;
  }
  world.punch *= 0.88;
  const z = cam.z * (1 + (REDUCED ? 0 : world.punch * 0.05));
  ctx.setTransform(z * DPR, 0, 0, z * DPR, (CW / 2 - cam.x * z + sx) * DPR, (CH / 2 - cam.y * z + sy) * DPR);
  drawArena(pal);
  if (mode === 'fight') drawSqueeze();
  if (mode === 'build') {
    ctx.fillStyle = pal.fog; ctx.fillRect(11, 0, COLS - 11, ROWS);
    if (flashCell && flashCell.t > 0) { ctx.fillStyle = `rgba(214,63,43,${0.5 * flashCell.t / 30})`; ctx.fillRect(flashCell.c, flashCell.r, 1, 1); flashCell.t--; }
  }
  for (const a of arrows) if (a.stuck) drawArrowShape(a.x - Math.cos(a.ang) * 0.62, a.y - Math.sin(a.ang) * 0.62, a.x, a.y, pal, a.owner, pal.ink);
  for (const u of U) drawTrail(u, pal);
  const order = U.slice().sort((a, b) => (a.state === 'dead') - (b.state === 'dead')).reverse();
  for (const u of order) {
    if (u.state === 'dead') { const S = ragSkel(u.rag); drawFig(S, u.side, pal, false); continue; }
    const S = skel(u); S.scarf = u.scarf;
    drawFig(S, u.side, pal, u.flash > 0 && u.flash % 2 === 0);
  }
  for (const a of arrows) if (!a.stuck) {
    const ux = Math.cos(a.ang), uy = Math.sin(a.ang);
    ctx.globalAlpha = 0.25; stroke([{ x: a.x - ux * 1.4, y: a.y - uy * 1.4 }, { x: a.x - ux * 0.5, y: a.y - uy * 0.5 }], pal[TEAM[a.owner]], 0.05); ctx.globalAlpha = 1;
    drawArrowShape(a.x - ux * 0.62, a.y - uy * 0.62, a.x, a.y, pal, a.owner, pal.ink);
  }
  drawParts(pal);

  // screen-space layer
  ctx.setTransform(DPR, 0, 0, DPR, sx * DPR, sy * DPR);
  for (const p of parts) if (p.k === 't') {
    const s = toScreen(p.x, p.y), k = 1 - p.life / p.max;
    screenText(p.txt, s.x, s.y, Math.max(14, p.size * cam.z), pal[p.c] || p.c, pal.bg, 'center', Math.min(1, k * 2));
  }
  const lblSize = Math.max(10, cam.z * 0.34);
  if (mode === 'build') {
    const s = toScreen(10, 1.7);
    screenText('NO-MAN\'S-LAND', s.x, s.y, lblSize, pal.label, null);
    const s2 = toScreen(5, 1.7);
    screenText('YOUR HALF', s2.x, s2.y, lblSize, pal.label, null);
  } else if (world.t < 240) {
    const a = Math.min(1, (240 - world.t) / 60);
    const s1 = toScreen(5, 1.7), s2 = toScreen(15, 1.7);
    screenText('YOUR HALF', s1.x, s1.y, lblSize, pal.label, null, 'center', a);
    screenText('RIVAL\'S HALF', s2.x, s2.y, lblSize, pal.label, null, 'center', a);
  }
  if (mode === 'fight') {
    if (world.intro > 0) {
      const k = world.intro / 55, size = Math.min(CW * 0.22, CH * 0.3) * (1 + (1 - k) * 0.15);
      screenText('FIGHT', CW / 2, CH * 0.45, size, pal.ink, pal.bg, 'center', Math.min(1, k * 3));
    }
    if (world.over && world.overT < 110) {
      const k = world.overT / 110, size = Math.min(CW * 0.26, CH * 0.34) * (1.25 - Math.min(1, world.overT / 12) * 0.25);
      screenText(world.ko ? 'K.O.' : 'TIME', CW / 2, CH * 0.42, size, world.impact > 0 ? pal.ink : PAL.red, pal.bg, 'center', Math.min(1, (1 - k) * 3));
    }
  }
}

// ---------------------------------------------------------------- UI
const ui = {
  phase: $('#phase'), hud: $('#hud'), clock: $('#clock'), wB: $('#wB'), wR: $('#wR'),
  fillB: $('#hpB .fill'), chipB: $('#hpB .chip'), fillR: $('#hpR .fill'), chipR: $('#hpR .chip'),
  toast: $('#toast'), result: $('#result'), resK: $('#resKicker'), resT: $('#resTitle'), resS: $('#resStats'),
  buildPanel: $('#buildPanel'), fightPanel: $('#fightPanel'), ticker: $('#ticker'), budget: $('#budget'),
  live: $('#liveActions'), end: $('#endActions'), speed: $('#speedBtn'), seed: $('#seedLbl'),
};
let tool = 'block', toastT = 0;
function toast(msg) {
  ui.toast.textContent = msg; ui.toast.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { ui.toast.hidden = true; }, 2400);
}
function refreshBuildUI() {
  for (const b of document.querySelectorAll('#weapons .opt')) b.setAttribute('aria-pressed', String(b.dataset.w === builds[0].weapon));
  for (const b of document.querySelectorAll('#tools .opt')) b.setAttribute('aria-pressed', String(b.dataset.t === tool));
  const s = spent(builds[0].pieces);
  ui.budget.textContent = `${s} / ${BUDGET} pts`;
  ui.budget.classList.toggle('full', s >= BUDGET);
}
function renderTicker() {
  if (!world || !world.log.length) { ui.ticker.innerHTML = '<li class="empty">Nothing yet.</li>'; return; }
  ui.ticker.innerHTML = '';
  for (const e of world.log.slice(-3).reverse()) {
    const li = document.createElement('li');
    li.className = e.side >= 0 ? `s${e.side}` : '';
    const t = document.createElement('time'); t.textContent = clockStr(e.t);
    const sw = document.createElement('i'); sw.className = 'sw';
    const sp = document.createElement('span'); sp.textContent = e.txt;
    li.append(t, sw, sp); ui.ticker.append(li);
  }
}
function updateHud() {
  if (mode !== 'fight') return;
  const [b, r] = U;
  ui.fillB.style.width = `${b.hp}%`; ui.chipB.style.width = `${b.hpShow}%`;
  ui.fillR.style.width = `${r.hp}%`; ui.chipR.style.width = `${r.hpShow}%`;
  ui.clock.textContent = clockStr(world.t);
  ui.clock.classList.toggle('sq', world.zone > 1.001 && !world.over);
}
function showResult() {
  const w = world.winner, st = world.stats;
  ui.resT.textContent = w === 0 ? 'You win' : w === 1 ? 'Rival wins' : 'Draw';
  ui.resT.className = 'res-t ' + (w === 0 ? 'b' : w === 1 ? 'r' : '');
  ui.resK.textContent = world.ko ? `KO · ${clockStr(world.t - world.overT)}` : `Time · ${Math.round(U[0].hp)} to ${Math.round(U[1].hp)} HP`;
  const mySpikes = [...Array(A.spikes.length).keys()].filter((i) => A.spikes[i] === 0).length;
  const theirSpikes = [...Array(A.spikes.length).keys()].filter((i) => A.spikes[i] === 1).length;
  const rows = [
    ['Your traps dealt', `${Math.round(st[0].trap)} dmg`],
    ['Rival traps dealt', `${Math.round(st[1].trap)} dmg`],
    ['Spikes found', `rival found ${st[1].found} of ${mySpikes} · you found ${st[0].found} of ${theirSpikes}`],
    ['Pad launches', `you ${st[0].pads} · rival ${st[1].pads}`],
  ];
  if (st[0].deflect + st[1].deflect) rows.push(['Arrows deflected', `you ${st[0].deflect} · rival ${st[1].deflect}`]);
  if (st[0].clash) rows.push(['Clashes', String(st[0].clash)]);
  ui.resS.innerHTML = '';
  for (const [k, v] of rows) { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; ui.resS.append(dt, dd); }
  ui.result.hidden = false; ui.live.hidden = true; ui.end.hidden = false;
  ui.phase.textContent = 'Result';
}

function enterBuild() {
  mode = 'build';
  A = makeArena([builds[0], null]);
  world = newWorld(1); world.intro = 0;
  U = [makeUnit(0, builds[0].weapon)];
  arrows = []; parts = [];
  ui.hud.hidden = true; ui.result.hidden = true; ui.buildPanel.hidden = false; ui.fightPanel.hidden = true;
  ui.phase.textContent = 'Build your half';
  refreshBuildUI();
}
function startFight(seed) {
  mode = 'fight';
  fightSeed = seed;
  if (!builds[1]) nextRival();
  A = makeArena(builds);
  world = newWorld(seed);
  U = [makeUnit(0, builds[0].weapon), makeUnit(1, builds[1].weapon)];
  for (const u of U) { u.nav = buildNav(u.side, u.b.speed); u.react = 8 + Math.floor(rng() * 10); }
  arrows = []; parts = [];
  ui.wB.textContent = WEAP[builds[0].weapon].name; ui.wR.textContent = WEAP[builds[1].weapon].name;
  ui.hud.hidden = false; ui.result.hidden = true; ui.buildPanel.hidden = true; ui.fightPanel.hidden = false;
  ui.live.hidden = false; ui.end.hidden = true;
  ui.phase.textContent = `vs ${WEAP[builds[1].weapon].name}`;
  ui.seed.textContent = `Seed ${seed}`;
  renderTicker(); updateHud();
}
const newSeed = () => 1 + Math.floor(Math.random() * 99999);

function applyTool(c, r) {
  const bd = builds[0];
  if (c === 9 || c === 10) { toast('No-man\'s-land stays open.'); return; }
  if (c >= 11) { toast('That half belongs to the rival.'); return; }
  if (c < BMIN || c > BMAX || r < 1 || r > 10) return;
  if (c === SPAWN_C && (r === 10 || r === 9)) { toast('Your fighter spawns here.'); flashCell = { c, r, t: 30 }; return; }
  let next = bd.pieces.filter((p) => !(p.c === c && p.r === r));
  const had = bd.pieces.find((p) => p.c === c && p.r === r);
  if (tool === 'erase') {
    if (!had) return;
    if (had.t === 'block') next = next.filter((p) => !(p.c === c && p.r === r - 1 && p.t !== 'block'));
  } else {
    if (had && had.t === tool) return;
    if (tool !== 'block') {
      const below = r + 1 === 11 || next.some((p) => p.c === c && p.r === r + 1 && p.t === 'block');
      if (!below) { toast(tool === 'pad' ? 'A pad needs solid ground under it.' : 'Spikes need solid ground under them.'); flashCell = { c, r, t: 30 }; return; }
    }
    if (had && had.t === 'block') next = next.filter((p) => !(p.c === c && p.r === r - 1 && p.t !== 'block'));
    next.push({ t: tool, c, r });
    if (spent(next) > BUDGET) { toast(`Out of points. ${BUDGET} per half.`); flashCell = { c, r, t: 30 }; return; }
  }
  const v = validate({ weapon: bd.weapon, pieces: next });
  if (!v.ok) { toast(v.msg); flashCell = { c, r, t: 30 }; return; }
  bd.pieces = next;
  A = makeArena([bd, null]);
  refreshBuildUI();
}

let painting = false, lastCell = '';
function cellAt(ev) {
  const r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left - CW / 2) / cam.z + cam.x, y = (ev.clientY - r.top - CH / 2) / cam.z + cam.y;
  return { c: Math.floor(x), r: Math.floor(y) };
}
cv.addEventListener('pointerdown', (ev) => {
  if (mode !== 'build') return;
  painting = true; cv.setPointerCapture(ev.pointerId);
  const { c, r } = cellAt(ev); lastCell = `${c},${r}`; applyTool(c, r);
});
cv.addEventListener('pointermove', (ev) => {
  if (!painting || mode !== 'build' || (tool !== 'block' && tool !== 'erase')) return;
  const { c, r } = cellAt(ev), k = `${c},${r}`;
  if (k !== lastCell) { lastCell = k; applyTool(c, r); }
});
const endPaint = () => { painting = false; };
cv.addEventListener('pointerup', endPaint); cv.addEventListener('pointercancel', endPaint);

$('#weapons').addEventListener('click', (ev) => {
  const b = ev.target.closest('.opt'); if (!b) return;
  const w = b.dataset.w;
  const v = validate({ weapon: w, pieces: builds[0].pieces });
  if (!v.ok) { toast(`${WEAP[w].name} can't make those jumps. Change your half first.`); return; }
  builds[0].weapon = w;
  U = [makeUnit(0, w)];
  refreshBuildUI();
});
$('#tools').addEventListener('click', (ev) => { const b = ev.target.closest('.opt'); if (!b) return; tool = b.dataset.t; refreshBuildUI(); });
$('#clearBtn').addEventListener('click', () => { builds[0].pieces = []; A = makeArena([builds[0], null]); refreshBuildUI(); });
$('#fightBtn').addEventListener('click', () => startFight(newSeed()));
$('#editBtn').addEventListener('click', enterBuild);
$('#edit2Btn').addEventListener('click', enterBuild);
$('#replayBtn').addEventListener('click', () => startFight(fightSeed));
$('#rematchBtn').addEventListener('click', () => startFight(newSeed()));
$('#nextBtn').addEventListener('click', () => { nextRival(); startFight(newSeed()); });
$('#speedBtn').addEventListener('click', () => { speedMul = speedMul === 1 ? 2 : 1; ui.speed.textContent = `Speed ${speedMul}×`; });

// ---------------------------------------------------------------- loop
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'fight') {
    acc += dt * speedMul * (world.slowT > 0 ? 0.3 : 1);
    let n = 0;
    while (acc >= DT && n < 12) {
      acc -= DT; n++;
      if (world.slowT > 0) world.slowT--;
      if (world.hs > 0) { world.hs--; if (world.impact > 0) world.impact--; continue; }
      simStep();
    }
    updateHud();
  } else {
    acc += dt;
    while (acc >= DT) {
      acc -= DT; world.t++;
      const u = U[0];
      poseStep(u); scarfStep(u, skel(u)); stepParts();
    }
  }
  render();
  requestAnimationFrame(frame);
}

// Headless hook: run a whole fight without rendering (used for testing balance and AI).
window.__homeTurf = {
  fight(seed, blue, red, maxFrames = TIME_CAP * 60 + 200, sample = 0) {
    const saved = [builds[0], builds[1]];
    builds[0] = blue; builds[1] = red;
    startFight(seed);
    let f = 0;
    while (f++ < maxFrames && !(world.over && world.overT > 5)) {
      if (world.hs > 0) { world.hs--; continue; }
      simStep();
      if (sample && world.t % sample === 0) world.trace.push(`${clockStr(world.t)} zone=${world.zone.toFixed(1)} ` + U.map((u) => `${u.side ? 'R' : 'B'} ${u.b.x.toFixed(1)},${u.b.y.toFixed(1)} ${u.state} hp${Math.round(u.hp)} goal=${u.ai.goal >= 0 && u.nav ? u.nav.nodes[u.ai.goal].c + ',' + u.nav.nodes[u.ai.goal].r : '-'} path=${u.ai.path.map((e) => e.type[0]).join('')} m=${u.ai.macro ? JSON.stringify(u.ai.macro) : ''}`).join(' | '));
    }
    const res = { seed, winner: world.winner, ko: world.ko, t: world.t, hp: U.map((u) => Math.round(u.hp)), stats: world.stats, log: world.log.map((e) => `${clockStr(e.t)} ${e.txt}`), trace: world.trace };
    builds[0] = saved[0]; builds[1] = saved[1];
    return res;
  },
  templates: TEMPLATES, validate, get world() { return world; }, get units() { return U; },
};

nextRival();
enterBuild();
requestAnimationFrame(frame);
})();
</script>
