<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10131a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lantern Row" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./favicon.png" />
  <title>Lantern Row</title>
</head>
<body>
  <div id="stage">
    <canvas id="scene"></canvas>
    <div class="hud">
      <div class="chip" id="hud-day">DAY 1 / 12</div>
      <div class="chip" id="hud-mesos"><b>50,000</b> MESOS</div>
      <div class="chip" id="hud-record">0W 0L</div>
      <div class="chip" id="hud-hint" style="visibility:hidden"></div>
    </div>
    <div class="pad">
      <button class="pad-btn" id="pad-full" aria-label="Fullscreen">⛶</button>
      <button class="pad-btn" id="pad-bag">BAG</button>
      <button class="pad-btn act" id="pad-act" disabled></button>
    </div>
    <div id="banner"></div>
    <div id="loading"><div class="spin"></div>LOADING</div>
  </div>
  <div id="rotate">
    <div class="phone"></div>
    <div>TURN YOUR PHONE</div>
    <button class="btn small" id="rotate-skip">play upright</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
