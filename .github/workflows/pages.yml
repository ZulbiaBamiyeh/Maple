# Publishes Gearfall to GitHub Pages on every push to the Gearfall branch.
# The game is static (plain ES modules), so the site is just index.html,
# styles.css and src/ copied as they are.
name: Deploy Gearfall

on:
  push:
    branches: [claude/character-art-equipped-items-xaj1jf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test tests/*.test.mjs
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html styles.css src _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
