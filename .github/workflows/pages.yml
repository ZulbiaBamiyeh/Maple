# Publishes ZereshkStory to GitHub Pages on every push to the game branch.
# The game is static (plain ES modules), so the site is just index.html,
# styles.css and src/, force-pushed to the gh-pages branch that Pages serves.
name: Deploy ZereshkStory

on:
  push:
    branches: [claude/character-art-equipped-items-xaj1jf]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test tests/*.test.mjs
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html styles.css src _site/
          touch _site/.nojekyll
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ZereshkStory ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
